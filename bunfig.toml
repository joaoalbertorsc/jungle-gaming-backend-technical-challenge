[test]
# NestJS decorators need reflect-metadata loaded before any test module is evaluated.
preload = ["./test/support/preload.ts"]

# Applied only when running with --coverage (see `test:unit:coverage`).
coverageThreshold = { lines = 0.9, functions = 0.9 }
coverageSkipTestFiles = true
coverageReporter = ["text", "lcov"]
coverageDir = "coverage"
